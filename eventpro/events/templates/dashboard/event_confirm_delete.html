{% extends 'dashboard/base_dashboard.html' %}
{% block page_title %}Delete Event{% endblock %}
{% block content %}
<div class="confirm-card">
  <div class="confirm-icon"><i class="fas fa-exclamation-triangle"></i></div>
  <h3>Delete "{{ event.title }}"?</h3>
  <p>This will permanently delete the event and all associated bookings. This action cannot be undone.</p>
  <form method="post" class="confirm-actions">
    {% csrf_token %}
    <a href="{% url 'dashboard_events' %}" class="btn-dash-secondary">Cancel</a>
    <button type="submit" class="btn-danger">Yes, Delete</button>
  </form>
</div>
{% endblock %}
